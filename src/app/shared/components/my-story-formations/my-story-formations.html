@let userFormationsList = userFormations();

<div #formationCard class="formationPresentation formationCard">
  <div class="align">
    <div class="timeline">
      <div class="dot"></div>
      <div class="line"></div>
    </div>
    <article class="articlGlobalPresentation">
      <p class="articleContent bold">
        {{ userFormationsList?.year | translate }}
      </p>
      <h3 class="titlePartPresentation bold formationName">
        {{ userFormationsList?.nameForm | translate }}
      </h3>
      <h3 class="formationDegree">{{ userFormationsList?.degree | translate }}</h3>
      <p class="articleContent">{{ userFormationsList?.skillsForm | translate }}</p>
    </article>
  </div>
</div>
