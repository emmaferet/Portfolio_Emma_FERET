<header class="header">
  @let nameTitleSignal = nameTitle();
  <h1 class="nameH1Title">{{ nameTitleSignal?.name }} {{ nameTitleSignal?.surname }}</h1>
  <nav>
    <ul class="align">
      @let headerList = headerNavigation();
      @for (listElement of headerList; track $index) {
        <li>
          <button class="headerNavigationButtons" (click)="navigateToProject(listElement.router)">
            {{ listElement.listNavigationElement }}
          </button>
        </li>
      }
    </ul>
  </nav>
  <a routerLink="/projects" class="darkPurpleSolidButton">Hire Me</a>
</header>
