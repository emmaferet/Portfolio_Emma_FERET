<header class="header">
  <h1 class="nameH1Title">Emma Feret</h1>
  <nav>
    <ul class="align">
      @let headerList = headerNavigation();
      @for (listElement of headerList; track listElement.listNavigationElement) {
        <li>
          <a href="#" class="headerNavigationButtons">{{ listElement.listNavigationElement }}</a>
        </li>
      }
    </ul>
  </nav>
  <a href="#" class="darkPurpleSolidButton">Hire Me</a>
</header>
