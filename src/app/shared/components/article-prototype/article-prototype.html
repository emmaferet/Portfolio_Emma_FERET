<div class="align centerContent">
  <article class="articlGlobalPresentation">
    <h2 class="titlePartPresentation">{{ this.currentArticle().title }}</h2>
    <h3 class="titleH3Hook">{{ this.currentArticle().subtitle }}</h3>
    <p class="articleContent">
      {{ this.currentArticle().content }}
    </p>
  </article>
  <img
    class="fitImageMyStorySour"
    src="{{ this.currentArticle().image }}"
    alt="{{ this.currentArticle().altImage }}"
  />
</div>
