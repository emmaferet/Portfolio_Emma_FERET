<!-- Use of angular material for dialog -->
<div class="marginDialog" animate.enter="enter-animation">
  <h2 mat-dialog-title class="titlePartPresentation">Merci pour votre message !</h2>

  <mat-dialog-content class="textDialog">
    <p>Je vous recontacterai dès que possible.</p>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-button mat-dialog-close class="darkPurpleSolidButtonNative">Fermer</button>
  </mat-dialog-actions>
</div>
