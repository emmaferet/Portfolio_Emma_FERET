@let experience = userExperience();
<article class="align justifyCenter">
  <div class="articlGlobalPresentation column">
    <p class="titlePartPresentation">{{ experience?.title }}</p>
    <p class="titleH3Hook">{{ experience?.company }}</p>
    <div class="articleContent">
      <p>{{ experience?.duration }}</p>
      <p>{{ experience?.description }}</p>
    </div>
  </div>
  <img src="{{ experience?.link }}" class="experienceImg" />
</article>
