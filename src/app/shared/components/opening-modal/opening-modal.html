<!-- Use of angular material for dialog -->
<div class="modal">
  <mat-dialog-actions>
    <button mat-button mat-dialog-close class="close-btn" (click)="closeModal()">✕</button>
  </mat-dialog-actions>
  <h2 mat-dialog-title class="title">
    BIENVENUE<br />
    SUR MON SITE
  </h2>

  <mat-dialog-content class="text">
    <p>
      Ce site est pour l'instant en Work In Progress !<br />
      Si vous avez des retours, n'hésitez pas me à les communiquer sur contact !
    </p>
  </mat-dialog-content>
</div>
